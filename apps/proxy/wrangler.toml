name = "coreframe-relay-proxy"
main = "src/index.ts"
# Pinned, not floating. Workers runtime behaviour changes with this date, and a proxy that
# silently changes behaviour on redeploy is the opposite of what this service is for.
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[vars]
ENVIRONMENT = "development"
# Real values are wrangler SECRETS, never vars, and never committed:
#   wrangler secret put RELAY_API_SECRET
#   wrangler secret put UPSTASH_QSTASH_TOKEN
# Local dev reads them from .dev.vars, which is gitignored.

# [RELAY-43] `name` here MUST match the Cloudflare Workers script the
# `in.relay.coreframe-labs.dev` route is already bound to — a route binds to a script by
# NAME, and the account already has a script called "coreframe-relay" (a dash-template
# stub, never real code) holding that route. Deploying under any other name creates a
# second, unbound script and leaves the route serving the stub. Confirmed via the
# Workers API's script list before this change, not assumed.
[env.production]
name = "coreframe-relay"
vars = { ENVIRONMENT = "production" }

[env.staging]
name = "coreframe-relay-proxy-staging"
vars = { ENVIRONMENT = "staging" }

# KV for idempotency keys and the route-lookup cache ([RELAY-4], [RELAY-43]). Bound
# 2026-08-27 — ids issued by `wrangler kv namespace create RELAY_KV --env <env>`, one
# namespace per environment so a staging cache entry can never satisfy a production
# lookup.
[[env.production.kv_namespaces]]
binding = "RELAY_KV"
id = "4ba0bfda67454dbfb43a598c7975a1e0"

[[env.staging.kv_namespaces]]
binding = "RELAY_KV"
id = "1c4f5dd24c1a4ef99ca553130b206490"

# [RELAY-13] Per-team, per-PLAN ingestion rate limiters.
#
# THREE bindings, not one — this is the direct consequence of a real platform constraint,
# not a style choice. Cloudflare's Rate Limiting binding fixes `simple.limit`/`period` at
# DEPLOY time per binding; `limit({ key })` only ever takes a key, nothing that varies the
# ceiling per caller. Confirmed against Cloudflare's own docs 2026-08-25 (see the note in
# `src/middleware/rateLimit.ts`): to get different ceilings for different callers, the
# platform's own answer is "define and configure multiple rate limiting configurations per
# Worker" — i.e. exactly this. So "configurable per plan without a redeploy" is delivered
# by the SELECTION varying at runtime (which binding a request's `route.plan` resolves to,
# read fresh from the dashboard every ROUTE_LOOKUP_CACHE_TTL_SECONDS), not by any single
# binding's own ceiling varying — Cloudflare does not offer that lever at all.
#
# Each `namespace_id` is chosen by us and must be distinct per binding, not issued by
# Cloudflare, so — like the single-binding version this replaces — all three are complete
# as written and enforce from the first deploy; no dependency on RELAY_KV, which is still
# unbound (see the block above).
#
# `period` accepts 10 or 60 seconds and nothing else, so all three tiers share it. Ceilings
# are a multiple of the original 600/minute FREE default (itself far above any real webhook
# source — Stripe's own single-account burst ceiling is well under it — and far below what
# would cost us anything): PRO at 5x, ENTERPRISE at 20x. These are starting numbers, not a
# measured product decision — revisit once a real PRO/ENTERPRISE customer exists to measure
# against. Adding a FOURTH tier needs a new binding here and IS a redeploy; changing which
# tier an EXISTING team is on is a single `Team.plan` UPDATE and needs no redeploy at all —
# that distinction is the literal boundary of what this mechanism does and does not cover.
#
# The key is still `teamId`, applied in the handler after authentication — never an IP,
# which Cloudflare rotates. Declared on every environment INCLUDING the top-level one so
# that `wrangler dev` exercises the same control the deployed Worker runs.
[[unsafe.bindings]]
name = "RELAY_RATE_LIMITER_FREE"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 600, period = 60 }

[[unsafe.bindings]]
name = "RELAY_RATE_LIMITER_PRO"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 3000, period = 60 }

[[unsafe.bindings]]
name = "RELAY_RATE_LIMITER_ENTERPRISE"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 12000, period = 60 }

[[env.production.unsafe.bindings]]
name = "RELAY_RATE_LIMITER_FREE"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 600, period = 60 }

[[env.production.unsafe.bindings]]
name = "RELAY_RATE_LIMITER_PRO"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 3000, period = 60 }

[[env.production.unsafe.bindings]]
name = "RELAY_RATE_LIMITER_ENTERPRISE"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 12000, period = 60 }

[[env.staging.unsafe.bindings]]
name = "RELAY_RATE_LIMITER_FREE"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 600, period = 60 }

[[env.staging.unsafe.bindings]]
name = "RELAY_RATE_LIMITER_PRO"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 3000, period = 60 }

[[env.staging.unsafe.bindings]]
name = "RELAY_RATE_LIMITER_ENTERPRISE"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 12000, period = 60 }

# [RELAY-67] Daily keep-warm ping so Supabase Free's 7-day no-activity pause never
# fires. Hits the DASHBOARD's /api/health (which performs one real DB read), observed
# via `wrangler tail`. Runs in deployed envs only; local dev has no need of it.
[env.production.triggers]
crons = ["17 4 * * *"]

[env.staging.triggers]
crons = ["17 4 * * *"]
