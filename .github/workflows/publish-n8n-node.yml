name: Publish n8n Node (Provenance)

on:
  push:
    tags:
      - "n8n-nodes-relay-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish with --dry-run (no real publish)"
        type: boolean
        default: false

defaults:
  run:
    working-directory: packages/n8n-nodes-relay

permissions:
  contents: read

jobs:
  publish:
    name: Build, test, and publish with provenance
    runs-on: ubuntu-latest
    # npm provenance requires OIDC-based GitHub Actions publishing (id-token: write),
    # not a manual `npm publish` from a laptop. Required by n8n's community-node
    # registry policy for a verified listing as of 2026-05-01.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Publish to npm with provenance
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: npm publish --provenance --access public --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
