# RELAY-85 — the release pipeline. Read docs/deploy-runbook.md before running this by
# hand; it is the numbered sequence this file automates the tail end of.
#
# WHAT THIS FILE DOES AND DOES NOT CONTROL — read this before trusting the approval gate:
#
# Vercel's own Git integration (once Project Settings → Git → Production Branch is set
# to `release`, per docs/deploy-runbook.md step 1) deploys the dashboard the INSTANT a
# push lands on `release`. That happens whether or not this workflow's approval gate has
# been clicked — GitHub Actions and Vercel's git integration are two independent
# listeners on the same push event, and no file in this repo can make one wait for the
# other (that would need a Vercel API token to disable git-triggered deploys via their
# API, which does not exist in this environment — see "what could not be automated"
# below). The REAL gate for the dashboard is therefore upstream of this file entirely:
# nothing gets pushed or merged to `release` until migrate.yml has gone green against
# production. Treat the push to `release` itself as the human approval for the dashboard.
#
# What this workflow's `environment: production` gate DOES genuinely hold back: the
# Worker deploy (Cloudflare has no git-integration auto-deploy — `wrangler deploy` only
# ever runs when something calls it, and this workflow is the only thing that does) and
# the post-deploy verification. Those two are fully under this file's control and are
# gated for real.
#
# WHAT COULD NOT BE AUTOMATED HERE, PLAINLY: this pipeline cannot itself deploy the
# dashboard (needs VERCEL_TOKEN — not available in this environment) or the Worker
# (needs CLOUDFLARE_API_TOKEN — the existing token cannot even list Workers, API error
# 10000, per growth/product/relay-launch-decisions.md #9; a rotated, correctly-scoped
# token must be added as a GitHub secret before the deploy-worker job can run at all).
# Every step below is written against real package.json scripts and real CLIs already in
# this repo's devDependencies (wrangler ^3.99.0, per apps/proxy/package.json) — nothing
# here has been executed against a live Cloudflare or Vercel account from this sandbox.
name: Deploy

on:
  push:
    branches: [release]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-release
  cancel-in-progress: false

jobs:
  # ── Confirm CI is actually green on this exact SHA ──────────────────────────────────
  # A workflow_dispatch run could be triggered against any SHA, not just the tip of
  # `release`. This closes that gap: it reads GitHub's combined check-runs status for
  # the SHA being deployed rather than assuming ci.yml already ran (or trusting a stale
  # green from a different commit).
  wait-for-ci:
    name: Confirm ci-required is green on this SHA
    runs-on: ubuntu-latest
    steps:
      - name: Poll check-runs for ci-required
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          repo="${{ github.repository }}"
          echo "Waiting for 'ci-required' to report a conclusion on $sha ..."
          for i in $(seq 1 40); do
            conclusion="$(gh api "repos/$repo/commits/$sha/check-runs" --jq '.check_runs[] | select(.name=="CI required checks") | .conclusion' 2>/dev/null || true)"
            status="$(gh api "repos/$repo/commits/$sha/check-runs" --jq '.check_runs[] | select(.name=="CI required checks") | .status' 2>/dev/null || true)"
            if [ "$status" = "completed" ]; then
              echo "ci-required completed with conclusion: $conclusion"
              if [ "$conclusion" != "success" ]; then
                echo "::error::ci-required did not succeed on $sha (conclusion=$conclusion). Refusing to deploy."
                exit 1
              fi
              exit 0
            fi
            echo "  attempt $i/40: ci-required status=${status:-<not yet reported>} — waiting 30s"
            sleep 30
          done
          echo "::error::Timed out after 20 minutes waiting for ci-required on $sha. Refusing to deploy without confirmation CI passed."
          exit 1

  # ── Manual approval gate ─────────────────────────────────────────────────────────────
  # Attach required reviewers to the "production" GitHub Environment (Settings →
  # Environments → production → Required reviewers). That is a one-time repo Settings
  # action this file cannot perform — see docs/deploy-runbook.md step 0. Until it is
  # configured, `environment: production` below is a label, not a gate — it starts
  # gating the instant a reviewer is attached, with no further change to this file.
  gate:
    name: Awaiting production approval
    needs: wait-for-ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Approved for ${{ github.sha }}. Proceeding to Worker deploy and verification."

  # ── Deploy the Worker ────────────────────────────────────────────────────────────────
  # The only actor that can put real code behind in.relay.coreframe-labs.dev. Uses the
  # repo's pinned wrangler (^3.99.0, apps/proxy/package.json) via pnpm, never a bare
  # `npx wrangler` — a bare npx can resolve a newer major (wrangler 4.x is already
  # installed in this sandbox's global npx cache, confirmed while building this
  # pipeline) and this repo has not verified compatibility with it (RELAY-20/21).
  deploy-worker:
    name: Deploy Worker
    needs: gate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Refuse to deploy with no Cloudflare credential
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::secrets.CLOUDFLARE_API_TOKEN is not set. See docs/credential-rotation.md — the current token cannot even list Workers (API error 10000) and must be rotated with Zone:DNS:Edit + Workers Scripts:Edit scope before this job can run at all."
            exit 1
          fi

      - name: wrangler deploy (production)
        working-directory: apps/proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy --env production

  # ── Verify both hosts, on the deployed artefact — never on a pre-deploy smoke ──────
  verify:
    name: Post-deploy verification (4 checks, 2 hosts)
    needs: [deploy-worker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Vercel's own deploy to land
        run: |
          echo "This job does not control Vercel's deploy timing (see the header comment"
          echo "above) — it can only wait for the result. Sleeping 60s as a floor before"
          echo "the first check; verify-deploy.sh itself retries every check for 3 minutes."
          sleep 60
      - name: Run three-host verification
        run: bash apps/dashboard/scripts/verify-deploy.sh
